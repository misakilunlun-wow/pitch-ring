<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ピッチリング | 発声トレーニング & テクニック分析</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #171a2b;
    --surface: #22273f;
    --surface-2: #2c3352;
    --gold: #e3a94c;
    --coral: #e2705f;
    --cool: #5b9dd6;
    --text: #f3efe6;
    --text-dim: #a6acc9;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: radial-gradient(ellipse at 50% -10%, #2a3050 0%, var(--ink) 55%);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display:flex;
    justify-content:center;
    padding: 24px 16px 40px;
  }
  .app{ width:100%; max-width: 440px; }
  header{ text-align:center; margin-bottom: 16px; }
  header h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 24px;
    margin: 0 0 4px;
  }
  header p{ margin:0; font-size: 13px; color: var(--text-dim); }

  .tabs{
    display:flex;
    gap: 6px;
    background: var(--surface);
    border-radius: 14px;
    padding: 5px;
    margin-bottom: 18px;
  }
  .tabs button{
    flex:1;
    padding: 10px 0;
    border: none;
    border-radius: 10px;
    background: transparent;
    color: var(--text-dim);
    font-family:'Inter', sans-serif;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
  .tabs button.active{ background: var(--gold); color: #1b1a12; }
  .tabs button:focus-visible{ outline:2px solid var(--text); outline-offset:2px; }

  .panel{ display:none; }
  .panel.active{ display:block; }

  /* ---- Mode 1: practice ring ---- */
  .ring-wrap{ position: relative; width: 260px; height: 260px; margin: 4px auto 18px; }
  canvas#ring{ width:100%; height:100%; display:block; }
  .ring-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; }
  .note{ font-family:'Fraunces', serif; font-size: 40px; font-weight:600; line-height:1; }
  .freq{ font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--text-dim); margin-top:6px; }
  .cents{ font-family:'JetBrains Mono', monospace; font-size:12px; margin-top:4px; min-height:16px; }

  .card{ background: var(--surface); border-radius: 16px; padding: 14px 16px 16px; margin-bottom: 14px; }
  .card .label{ font-size:12px; color:var(--text-dim); display:block; margin-bottom:10px; }

  .notes{ display:grid; grid-template-columns: repeat(8, 1fr); gap:6px; }
  .notes button{
    background: var(--surface-2); border:none; color:var(--text); font-size:13px; font-weight:500;
    padding:10px 0; border-radius:9px; cursor:pointer;
  }
  .notes button.active{ background: var(--gold); color:#1b1a12; }
  .notes button:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  .primary-btn{
    width:100%; padding:15px 0; border-radius:14px; border:none;
    background: var(--gold); color:#1b1a12; font-size:15px; font-weight:600; cursor:pointer;
    font-family:'Inter', sans-serif; margin-bottom: 12px;
  }
  .primary-btn.active-state{ background: var(--surface-2); color:var(--text); }
  .primary-btn:focus-visible{ outline:2px solid var(--text); outline-offset:2px; }
  .primary-btn:disabled{ opacity:0.55; cursor:default; }

  .status{ text-align:center; font-size:12px; color:var(--text-dim); min-height:16px; margin-bottom:12px; }

  .stats{ display:grid; grid-template-columns: repeat(3,1fr); gap:10px; text-align:center; }
  .stats > div{ background: var(--surface); border-radius:14px; padding:14px 4px; }
  .stats span{ font-family:'JetBrains Mono', monospace; font-size:19px; font-weight:600; display:block; }
  .stats small{ font-size:10px; color:var(--text-dim); }

  /* ---- Mode 2: technique analysis ---- */
  .rec-row{ display:flex; align-items:center; gap:10px; margin-bottom: 4px; }
  .rec-timer{
    font-family:'JetBrains Mono', monospace; font-size: 13px; color: var(--text-dim);
    text-align:center; margin-bottom: 12px;
  }
  .chart-wrap{ background: var(--surface); border-radius:16px; padding: 12px 10px 6px; margin-bottom:14px; overflow-x:auto; }
  canvas#chart{ width:100%; height:200px; display:block; }
  .legend{ display:flex; flex-wrap:wrap; gap: 8px 14px; padding: 6px 4px 2px; }
  .legend span{ font-size:11px; color: var(--text-dim); display:flex; align-items:center; gap:5px; }
  .legend i{ width:9px; height:9px; border-radius:50%; display:inline-block; }

  .event-list{ display:flex; flex-direction:column; gap:8px; }
  .event-item{
    background: var(--surface); border-radius: 12px; padding: 10px 12px;
    display:flex; align-items:center; gap:10px; font-size:13px;
  }
  .event-item .dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .event-item .ev-body{ flex:1; }
  .event-item .ev-type{ font-weight:600; }
  .event-item .ev-detail{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--text-dim); }
  .event-item .ev-time{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--text-dim); }
  .empty-note{ text-align:center; font-size:12px; color:var(--text-dim); padding: 14px 0; }
  .disclaimer{ font-size:11px; color:var(--text-dim); line-height:1.6; margin-top: 16px; padding: 0 4px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>ピッチリング</h1>
    <p>音程練習 & テクニック分析</p>
  </header>

  <div class="tabs">
    <button id="tabBtn1" class="active">🎯 音程練習</button>
    <button id="tabBtn2">🎤 テクニック分析</button>
  </div>

  <!-- ============ MODE 1: PRACTICE ============ -->
  <div class="panel active" id="panel1">
    <div class="ring-wrap">
      <canvas id="ring" width="260" height="260"></canvas>
      <div class="ring-center">
        <div class="note" id="noteName">ー</div>
        <div class="freq" id="freqVal">0.0 Hz</div>
        <div class="cents" id="centsVal"></div>
      </div>
    </div>

    <div class="card">
      <span class="label">目標の音を選ぶ</span>
      <div class="notes" id="noteButtons"></div>
    </div>

    <button class="primary-btn" id="micBtn">マイクを開始する</button>
    <div class="status" id="statusMsg"></div>

    <div class="stats">
      <div><span id="streakVal">0.0</span><small>キープ秒数</small></div>
      <div><span id="accuracyVal">0%</span><small>正確度</small></div>
      <div><span id="bestVal">0.0</span><small>自己ベスト</small></div>
    </div>
  </div>

  <!-- ============ MODE 2: TECHNIQUE ANALYSIS ============ -->
  <div class="panel" id="panel2">
    <button class="primary-btn" id="recBtn">リアルタイム分析を開始する</button>
    <div class="rec-timer" id="recTimer"></div>
    <div class="status" id="statusMsg2"></div>

    <div class="chart-wrap">
      <canvas id="chart" width="640" height="200"></canvas>
      <div class="legend" id="legend"></div>
    </div>

    <div class="event-list" id="eventList">
      <div class="empty-note">開始すると、検出されたテクニックがここに新しい順で表示されます</div>
    </div>

    <p class="disclaimer">
      ※ ピッチと音量の変化パターンから推定する簡易解析です。DAMの精密採点と同程度の厳格さ（装飾音の幅・時間幅）に調整してあります。
    </p>
  </div>
</div>

<script>
(function(){
  // ============ SHARED AUDIO SETUP ============
  let audioCtx, analyser, dataArray, micStream, micReady = false;

  async function ensureMic(){
    if (micReady) return true;

    if (!window.isSecureContext){
      throw new Error('このページは安全な接続(HTTPS)で開かれていません。');
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      throw new Error('マイク機能がサポートされていません。');
    }

    let stream;
    try{
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    } catch(err){
      throw new Error(`[${err.name}] ${err.message || '詳細不明のエラー'}`);
    }

    micStream = stream;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    dataArray = new Float32Array(analyser.fftSize);
    const source = audioCtx.createMediaStreamSource(stream);
    source.connect(analyser);
    micReady = true;
    return true;
  }

  function autoCorrelate(buf, sampleRate){
    const SIZE = buf.length;
    let rms = 0;
    for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
    rms = Math.sqrt(rms / SIZE);
    if (rms < 0.015) return -1; // ノイズフロアを少し引き上げて安定化

    let r1 = 0, r2 = SIZE - 1;
    const thres = 0.2;
    for (let i = 0; i < SIZE / 2; i++){ if (Math.abs(buf[i]) < thres) { r1 = i; break; } }
    for (let i = 1; i < SIZE / 2; i++){ if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; } }
    const trimmed = buf.slice(r1, r2);
    const n = trimmed.length;
    if (n < 8) return -1;

    const c = new Array(n).fill(0);
    for (let i = 0; i < n; i++){
      for (let j = 0; j < n - i; j++) c[i] += trimmed[j] * trimmed[j + i];
    }
    let d = 0;
    while (d < n - 1 && c[d] > c[d + 1]) d++;
    let maxVal = -1, maxPos = -1;
    for (let i = d; i < n; i++){ if (c[i] > maxVal){ maxVal = c[i]; maxPos = i; } }
    if (maxPos <= 0) return -1;
    let T0 = maxPos;
    const x1 = c[T0 - 1] !== undefined ? c[T0 - 1] : c[T0];
    const x2 = c[T0];
    const x3 = c[T0 + 1] !== undefined ? c[T0 + 1] : c[T0];
    const a = (x1 + x3 - 2 * x2) / 2;
    const b = (x3 - x1) / 2;
    if (a) T0 = T0 - b / (2 * a);
    if (T0 <= 0) return -1;
    return sampleRate / T0;
  }

  function rmsOf(buf){
    let s = 0;
    for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
    return Math.sqrt(s / buf.length);
  }

  const noteNamesJP = ['ド','ド#','レ','レ#','ミ','ファ','ファ#','ソ','ソ#','ラ','ラ#','シ'];
  function midiFromFreq(f){ return 69 + 12 * Math.log2(f / 440); }
  function noteLabelFromMidi(m){
    const rounded = Math.round(m);
    const idx = ((rounded % 12) + 12) % 12;
    const octave = Math.floor(rounded / 12) - 1;
    return noteNamesJP[idx] + octave;
  }

  // ============ TABS ============
  const tabBtn1 = document.getElementById('tabBtn1');
  const tabBtn2 = document.getElementById('tabBtn2');
  const panel1 = document.getElementById('panel1');
  const panel2 = document.getElementById('panel2');

  tabBtn1.addEventListener('click', () => {
    stopPractice();
    stopStreaming();
    tabBtn1.classList.add('active'); tabBtn2.classList.remove('active');
    panel1.classList.add('active'); panel2.classList.remove('active');
  });
  tabBtn2.addEventListener('click', () => {
    stopPractice();
    tabBtn2.classList.add('active'); tabBtn1.classList.remove('active');
    panel2.classList.add('active'); panel1.classList.remove('active');
  });

  // ============ MODE 1: PRACTICE RING ============
  const scale = [
    { label: 'ド', note: 60 }, { label: 'レ', note: 62 }, { label: 'ミ', note: 64 }, { label: 'ファ', note: 65 },
    { label: 'ソ', note: 67 }, { label: 'ラ', note: 69 }, { label: 'シ', note: 71 }, { label: 'ド', note: 72 },
  ];
  const noteButtonsEl = document.getElementById('noteButtons');
  const micBtn = document.getElementById('micBtn');
  const statusMsg = document.getElementById('statusMsg');
  const noteNameEl = document.getElementById('noteName');
  const freqValEl = document.getElementById('freqVal');
  const centsValEl = document.getElementById('centsVal');
  const streakValEl = document.getElementById('streakVal');
  const accuracyValEl = document.getElementById('accuracyVal');
  const bestValEl = document.getElementById('bestVal');
  const ringCanvas = document.getElementById('ring');
  const ringCtx = ringCanvas.getContext('2d');

  let targetMidi = 69;
  let practicing = false;
  let practiceRaf;
  let smoothedCents = 0;
  let streakStart = null;
  let bestStreak = 0;
  let framesInTune = 0, framesTotal = 0;

  function buildNoteButtons(){
    scale.forEach((n) => {
      const btn = document.createElement('button');
      btn.textContent = n.label;
      if (n.note === targetMidi) btn.classList.add('active');
      btn.addEventListener('click', () => {
        targetMidi = n.note;
        document.querySelectorAll('#noteButtons button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        resetSession();
      });
      noteButtonsEl.appendChild(btn);
    });
  }

  function resetSession(){
    framesInTune = 0; framesTotal = 0; streakStart = null;
    accuracyValEl.textContent = '0%'; streakValEl.textContent = '0.0';
  }

  function colorForCents(cents, voiced){
    if (!voiced) return 'rgba(166,172,201,0.35)';
    const abs = Math.abs(cents);
    if (abs < 12) return '#e3a94c';
    if (cents < 0) return '#5b9dd6';
    return '#e2705f';
  }

  function drawRing(cents, voiced){
    const w = ringCanvas.width, h = ringCanvas.height;
    const cx = w/2, cy = h/2, radius = w/2 - 16;
    ringCtx.clearRect(0,0,w,h);
    const startAngle = Math.PI * 0.75, endAngle = Math.PI * 2.25;
    ringCtx.beginPath(); ringCtx.arc(cx,cy,radius,startAngle,endAngle);
    ringCtx.strokeStyle = 'rgba(255,255,255,0.08)'; ringCtx.lineWidth = 14; ringCtx.lineCap='round'; ringCtx.stroke();
    const midAngle = (startAngle+endAngle)/2;
    ringCtx.beginPath(); ringCtx.arc(cx,cy,radius,midAngle-0.05,midAngle+0.05);
    ringCtx.strokeStyle='rgba(227,169,76,0.5)'; ringCtx.lineWidth=14; ringCtx.stroke();
    const clamped = Math.max(-50, Math.min(50, cents));
    const t = (clamped+50)/100;
    const valueAngle = startAngle + t*(endAngle-startAngle);
    const color = colorForCents(cents, voiced);
    ringCtx.beginPath(); ringCtx.arc(cx,cy,radius,midAngle,valueAngle, valueAngle<midAngle);
    ringCtx.strokeStyle=color; ringCtx.lineWidth=14; ringCtx.lineCap='round';
    ringCtx.shadowColor=color; ringCtx.shadowBlur = voiced?14:0; ringCtx.stroke(); ringCtx.shadowBlur=0;
    const dotX = cx + radius*Math.cos(valueAngle), dotY = cy + radius*Math.sin(valueAngle);
    ringCtx.beginPath(); ringCtx.arc(dotX,dotY,7,0,Math.PI*2);
    ringCtx.fillStyle = voiced? '#f3efe6':'rgba(243,239,230,0.4)'; ringCtx.fill();
  }

  function practiceUpdate(freq){
    const voiced = freq > 0;
    let cents = 0;
    if (voiced){
      const detectedMidi = midiFromFreq(freq);
      cents = (detectedMidi - targetMidi) * 100;
      smoothedCents += (cents - smoothedCents) * 0.35;
      noteNameEl.textContent = noteLabelFromMidi(detectedMidi);
      freqValEl.textContent = freq.toFixed(1) + ' Hz';
      const centsAbs = Math.abs(Math.round(cents));
      if (centsAbs < 12){ centsValEl.textContent='ぴったり'; centsValEl.style.color='#e3a94c'; }
      else { centsValEl.textContent=(cents>0?'+':'')+Math.round(cents)+' cent'; centsValEl.style.color = cents>0?'#e2705f':'#5b9dd6'; }
      framesTotal++;
      if (Math.abs(cents) < 15){ framesInTune++; if (streakStart===null) streakStart=performance.now(); }
      else streakStart = null;
    } else {
      smoothedCents += (0 - smoothedCents) * 0.15;
      noteNameEl.textContent='ー'; freqValEl.textContent='0.0 Hz'; centsValEl.textContent='';
      streakStart = null;
    }
    drawRing(smoothedCents, voiced);
    const streakSec = streakStart ? (performance.now()-streakStart)/1000 : 0;
    streakValEl.textContent = streakSec.toFixed(1);
    if (streakSec > bestStreak){ bestStreak = streakSec; bestValEl.textContent = bestStreak.toFixed(1); saveBest(bestStreak); }
    if (framesTotal > 0) accuracyValEl.textContent = Math.round((framesInTune/framesTotal)*100) + '%';
  }

  function practiceLoop(){
    analyser.getFloatTimeDomainData(dataArray);
    const freq = autoCorrelate(dataArray, audioCtx.sampleRate);
    practiceUpdate(freq);
    practiceRaf = requestAnimationFrame(practiceLoop);
  }

  async function startPractice(){
    try{
      statusMsg.textContent = 'マイクへのアクセスを許可してください…';
      await ensureMic();
      practicing = true;
      micBtn.textContent = 'マイクを停止する';
      micBtn.classList.add('active-state');
      statusMsg.textContent = '声を出してみましょう。目標の音に合わせてください。';
      resetSession();
      practiceLoop();
    } catch(e){
      statusMsg.textContent = 'マイクエラー: ' + e.message;
    }
  }

  function stopPractice(){
    if (!practicing) return;
    practicing = false;
    if (practiceRaf) cancelAnimationFrame(practiceRaf);
    micBtn.textContent = 'マイクを開始する';
    micBtn.classList.remove('active-state');
    statusMsg.textContent = '';
    drawRing(0, false);
  }

  micBtn.addEventListener('click', () => { practicing ? stopPractice() : startPractice(); });

  async function loadBest(){
    try{
      const saved = localStorage.getItem('pitch-ring:best-streak');
      if (saved){ bestStreak = parseFloat(saved)||0; bestValEl.textContent = bestStreak.toFixed(1); }
    } catch(e){}
  }
  async function saveBest(value){
    try{ localStorage.setItem('pitch-ring:best-streak', String(value.toFixed(1))); } catch(e){}
  }

  // ============ MODE 2: TECHNIQUE ANALYSIS ============
  const recBtn = document.getElementById('recBtn');
  const recTimer = document.getElementById('recTimer');
  const statusMsg2 = document.getElementById('statusMsg2');
  const chartCanvas = document.getElementById('chart');
  const chartCtx = chartCanvas.getContext('2d');
  const legendEl = document.getElementById('legend');
  const eventListEl = document.getElementById('eventList');

  const TYPE_INFO = {
    'shakuri':        { label: 'しゃくり',     color: '#5b9dd6' },
    'gyaku-shakuri':  { label: '逆しゃくり',   color: '#8f7fe0' },
    'kobushi':        { label: 'こぶし',       color: '#e3a94c' },
    'gyaku-kobushi':  { label: '逆こぶし',     color: '#e2705f' },
    'vibrato':        { label: 'ビブラート',   color: '#9bd66b' },
    'accent':         { label: 'アクセント',   color: '#ff6f91' },
  };

  function buildLegend(){
    legendEl.innerHTML = '';
    Object.values(TYPE_INFO).forEach(info => {
      const span = document.createElement('span');
      span.innerHTML = `<i style="background:${info.color}"></i>${info.label}`;
      legendEl.appendChild(span);
    });
  }
  buildLegend();

  let streaming = false;
  let streamRaf;
  let streamStartPerf = 0;
  let liveBuffer = [];
  let currentPhrase = [];
  let silenceStart = null;
  let allEvents = [];
  let lastKobushiTime = 0;
  let frameCounter = 0;
  const WINDOW_SEC = 6;
  const ANALYZE_EVERY_N_FRAMES = 6;

  function streamLoop(){
    analyser.getFloatTimeDomainData(dataArray);
    const freq = autoCorrelate(dataArray, audioCtx.sampleRate);
    const rms = rmsOf(dataArray);
    const now = performance.now();
    const t = (now - streamStartPerf) / 1000;
    const voiced = freq > 0;
    const cents = voiced ? 1200 * Math.log2(freq/440) : null;
    const sample = { t, cents, rms, voiced };

    liveBuffer.push(sample);
    while (liveBuffer.length && liveBuffer[0].t < t - WINDOW_SEC - 1) liveBuffer.shift();

    if (voiced){
      currentPhrase.push(sample);
      silenceStart = null;
    } else {
      if (silenceStart === null) silenceStart = t;
      if (t - silenceStart >= 0.15 && currentPhrase.length){
        runIncrementalAnalysis();
        currentPhrase = [];
      }
    }

    frameCounter++;
    if (currentPhrase.length >= 4 && frameCounter % ANALYZE_EVERY_N_FRAMES === 0){
      runIncrementalAnalysis();
    }

    recTimer.textContent = '計測中… ' + t.toFixed(1) + '秒';
    drawLiveChart(t);
    streamRaf = requestAnimationFrame(streamLoop);
  }

  function runIncrementalAnalysis(){
    if (currentPhrase.length < 4) return;
    const events = analyzePhrase(currentPhrase);
    events.forEach(ev => {
      // 直前と同じ時間帯（0.25秒以内）の重複イベントを防止
      const exists = allEvents.some(e => e.type === ev.type && Math.abs(e.time - ev.time) < 0.25);
      if (!exists){
        allEvents.push(ev);
        renderEventItem(ev);
      }
    });
  }

  function renderEventItem(ev){
    const info = TYPE_INFO[ev.type] || { label: ev.type, color: '#e3a94c' };
    const empty = eventListEl.querySelector('.empty-note');
    if (empty) empty.remove();

    const item = document.createElement('div');
    item.className = 'event-item';
    item.innerHTML = `
      <div class="dot" style="background:${info.color}"></div>
      <div class="ev-body">
        <div class="ev-type" style="color:${info.color}">${info.label}</div>
        <div class="ev-detail">${ev.detail || ''}</div>
      </div>
      <div class="ev-time">${ev.time.toFixed(1)}s</div>
    `;
    eventListEl.insertBefore(item, eventListEl.firstChild);
  }

  function drawLiveChart(currentT){
    const w = chartCanvas.width, h = chartCanvas.height;
    chartCtx.clearRect(0,0,w,h);

    const minT = Math.max(0, currentT - WINDOW_SEC);
    const maxT = currentT;
    const tToX = t => ((t - minT) / (maxT - minT)) * w;

    chartCtx.strokeStyle = 'rgba(255,255,255,0.05)';
    chartCtx.lineWidth = 1;
    for (let c = -2400; c <= 2400; c += 100){
      const y = h/2 - (c / 1200) * (h/2);
      if (y >= 0 && y <= h){
        chartCtx.beginPath(); chartCtx.moveTo(0, y); chartCtx.lineTo(w, y); chartCtx.stroke();
      }
    }

    chartCtx.strokeStyle = 'rgba(227,169,76,0.3)';
    chartCtx.beginPath(); chartCtx.moveTo(0, h/2); chartCtx.lineTo(w, h/2); chartCtx.stroke();

    if (!liveBuffer.length) return;

    chartCtx.lineWidth = 2.5;
    chartCtx.strokeStyle = '#5b9dd6';
    chartCtx.beginPath();
    let drawing = false;

    for (let i = 0; i < liveBuffer.length; i++){
      const s = liveBuffer[i];
      if (s.t < minT) continue;
      if (s.voiced && s.cents !== null){
        const x = tToX(s.t);
        const y = h/2 - ((s.cents % 1200) / 600) * (h/3);
        if (!drawing){ chartCtx.moveTo(x, y); drawing = true; }
        else { chartCtx.lineTo(x, y); }
      } else {
        if (drawing){ chartCtx.stroke(); chartCtx.beginPath(); drawing = false; }
      }
    }
    if (drawing) chartCtx.stroke();

    allEvents.forEach(ev => {
      if (ev.time >= minT && ev.time <= maxT){
        const x = tToX(ev.time);
        const info = TYPE_INFO[ev.type] || { color: '#e3a94c' };
        chartCtx.fillStyle = info.color;
        chartCtx.beginPath(); chartCtx.arc(x, 16, 5, 0, Math.PI * 2); chartCtx.fill();
        chartCtx.strokeStyle = info.color;
        chartCtx.lineWidth = 1;
        chartCtx.beginPath(); chartCtx.moveTo(x, 22); chartCtx.lineTo(x, h); chartCtx.stroke();
      }
    });
  }

  // ---- DAM基準テクニック判定アルゴリズム ----
  function analyzePhrase(phrase){
    const events = [];
    if (phrase.length < 5) return events;

    const dt = phrase[phrase.length - 1].t - phrase[0].t;
    if (dt <= 0) return events;

    // 1. しゃくり & 逆しゃくり（歌い出しの滑らかなピッチ移動）
    const onsetSpan = phrase.filter(s => s.t - phrase[0].t <= 0.30);
    if (onsetSpan.length >= 3){
      const cents = onsetSpan.map(s => s.cents);
      const diff = cents[cents.length - 1] - cents[0];
      if (diff >= 80 && diff <= 350){
        events.push({ type: 'shakuri', time: onsetSpan[0].t, detail: `+${Math.round(diff)} cents` });
      } else if (diff <= -80 && diff >= -350){
        events.push({ type: 'gyaku-shakuri', time: onsetSpan[0].t, detail: `${Math.round(diff)} cents` });
      }
    }

    // 2. こぶし & 逆こぶし（DAM採点基準に準拠した厳格な装飾音判定）
    for (let i = 2; i < phrase.length - 2; i++){
      const prev = phrase[i-2].cents, curr = phrase[i].cents, next = phrase[i+2].cents;
      const t = phrase[i].t;
      const dtLocal = phrase[i+2].t - phrase[i-2].t;
      
      // DAM基準: 短い時間（0.08秒〜0.25秒）かつ明確な山/谷（50cent〜200cent）
      if (dtLocal >= 0.08 && dtLocal <= 0.25 && (t - lastKobushiTime > 0.30)){
        const delta = curr - ((prev + next) / 2);
        
        // 【修正】プラス（上がって戻る＝山）が「こぶし」
        if (delta >= 50 && delta <= 220){
          events.push({ type: 'kobushi', time: t, detail: `装飾音 (+${Math.round(delta)}c)` });
          lastKobushiTime = t;
        } 
        // 【修正】マイナス（下がって戻る＝谷）が「逆こぶし」
        else if (delta <= -50 && delta >= -220){
          events.push({ type: 'gyaku-kobushi', time: t, detail: `装飾音 (${Math.round(delta)}c)` });
          lastKobushiTime = t;
        }
      }
    }

    // 3. ビブラート（周期性と振幅の厳格化）
    if (phrase.length >= 12){
      let zeroCrossings = 0;
      const mean = phrase.reduce((a, b) => a + b.cents, 0) / phrase.length;
      for (let i = 1; i < phrase.length; i++){
        if ((phrase[i-1].cents - mean) * (phrase[i].cents - mean) < 0) zeroCrossings++;
      }
      const rate = (zeroCrossings / 2) / dt;
      if (rate >= 4.0 && rate <= 8.0 && dt >= 0.6){
        const maxC = Math.max(...phrase.map(s => s.cents));
        const minC = Math.min(...phrase.map(s => s.cents));
        const depth = (maxC - minC) / 2;
        if (depth >= 15 && depth <= 90){
          events.push({ type: 'vibrato', time: phrase[0].t, detail: `${rate.toFixed(1)}Hz / ±${Math.round(depth)}c` });
        }
      }
    }

    // 4. アクセント
    for (let i = 1; i < phrase.length; i++){
      const dRms = phrase[i].rms - phrase[i-1].rms;
      if (dRms > 0.08){
        events.push({ type: 'accent', time: phrase[i].t, detail: `アタック` });
      }
    }

    return events;
  }

  async function startStreaming(){
    try{
      statusMsg2.textContent = 'マイクへのアクセスを許可してください…';
      await ensureMic();
      streaming = true;
      recBtn.textContent = '分析を停止する';
      recBtn.classList.add('active-state');
      statusMsg2.textContent = '声を出すと、ピッチ軌跡とテクニックがリアルタイム表示されます。';
      
      streamStartPerf = performance.now();
      liveBuffer = []; currentPhrase = []; allEvents = []; lastKobushiTime = 0;
      eventListEl.innerHTML = '<div class="empty-note">検出されたテクニックがここに表示されます</div>';
      
      streamLoop();
    } catch(e){
      statusMsg2.textContent = 'マイクエラー: ' + e.message;
    }
  }

  function stopStreaming(){
    if (!streaming) return;
    streaming = false;
    if (streamRaf) cancelAnimationFrame(streamRaf);
    recBtn.textContent = 'リアルタイム分析を開始する';
    recBtn.classList.remove('active-state');
    statusMsg2.textContent = '';
    recTimer.textContent = '';
  }

  recBtn.addEventListener('click', () => { streaming ? stopStreaming() : startStreaming(); });

  // Init
  buildNoteButtons();
  loadBest();
})();
</script>
